<!--
  Màn chào. Xem ghi chú dài ở landing-welcome.ts về lý do nó KHÔNG phải cổng
  chặn, và vì sao nó nằm dưới cùng để hero trôi lên đè phủ.

  Cố ý KHÔNG có <h1> ở đây. Tấm này là một tấm bìa mang tên sản phẩm, không
  phải một khu vực có nội dung; còn <h1> thật của trang là câu chào hàng ở hero
  ("Your team's work, on one board"), và một trang chỉ nên có đúng một cái. Khu
  vực tự xưng tên bằng `aria-label`.
-->
<section class="welcome" aria-label="Welcome to Horizon Hub Harmony">
  <!--
    BA LỚP CHIỀU SÂU, tất cả đều trang trí nên aria-hidden hết.

    Trước khi có khối này, màn chào là một nền phẳng trơn — mà hero ngay sau nó
    lại có cực quang, lưới và thẻ trôi. Hai màn liền nhau, một giàu một trống,
    nên mắt đọc ra ngay là thiếu.

    Xa nhất: cực quang, cùng kỹ thuật với hero nhưng DỊU HƠN MỘT BẬC — màn chào
    là chỗ hít vào, hero mới là chỗ thở ra. Cũng nhờ vậy hai màn nối liền được
    về thị giác thay vì như hai trang khác nhau.
    Giữa: bóng ba cột Kanban. Không thẻ, không chữ — chỉ là hình bóng của một
    tấm bảng, nói trước người ta sắp thấy gì mà không tốn một chữ nào. Ba chữ H
    đứng giữa ba cột thành một bố cục có chủ ý.
  -->
  <div class="wc-bg" aria-hidden="true">
    <span class="wc-aurora wc-a"></span>
    <span class="wc-aurora wc-b"></span>
    <span class="wc-aurora wc-c"></span>
    <span class="wc-grid"></span>
    <span class="wc-cols">
      <span></span>
      <span></span>
      <span></span>
    </span>

    <!--
      Thẻ Kanban ở HAI RÌA, tràn một phần ra ngoài mép màn hình — như thể tấm
      bảng còn chạy tiếp ra ngoài khung hình.

      Thuần hình khối: một vạch nhãn màu, vài vạch xám thay cho chữ. Không một
      ký tự nào, vì đây là trang trí — chữ thật ở đây sẽ tranh đọc với cái tên ở
      giữa, mà trình đọc màn hình thì lại phải đọc thêm mấy dòng vô nghĩa.

      KHÁC hẳn thẻ trôi ở hero, và khác có chủ đích: hero dùng viên nhỏ, nét,
      nằm tiền cảnh quanh tiêu đề. Ở đây là thẻ TO, MỜ, LÙI SÂU, nằm ở lớp nền.
      Hai độ sâu khác nhau thì mắt đọc ra là hai thứ khác nhau, chứ không phải
      một thứ lặp lại hai lần.
    -->
    <span class="wc-cards">
      <span class="wc-card wc-k1">
        <i class="wc-lb lb-blue"></i>
        <i class="wc-ln"></i>
        <i class="wc-ln wc-ln-s"></i>
      </span>
      <span class="wc-card wc-k2">
        <i class="wc-lb lb-green"></i>
        <i class="wc-ln"></i>
      </span>
      <span class="wc-card wc-k3">
        <i class="wc-lb lb-amber"></i>
        <i class="wc-ln"></i>
        <i class="wc-ln wc-ln-s"></i>
      </span>
      <span class="wc-card wc-k4">

        <i class="wc-ln"></i>
        <i class="wc-ln wc-ln-s"></i>
      </span>
      <span class="wc-card wc-k5">
        <i class="wc-lb lb-blue"></i>
        <i class="wc-ln"></i>
      </span>
    </span>
  </div>

  <!-- Gần nhất: chữ nhỏ ở HAI GÓC DƯỚI, biến khoảng trống thành một cái khung
       có chủ ý thay vì chỗ chưa kịp điền.
       Cố ý KHÔNG có hai góc trên: thanh nav cố định cao 69px đã chiếm trọn dải
       đó với logo, sáu mục điều hướng và hai nút — đo được là hai nhãn trên rơi
       vào y=39, tức nằm ĐÈ LÊN logo và bị nút "Start free" nuốt mất. Thanh nav
       chính là cái khung phía trên rồi; chen thêm chữ vào chỉ tổ đè nhau. -->
  <ul class="wc-meta">
    <li class="wc-bl">Kanban, but quieter</li>
    <li class="wc-br">Made by three students</li>
  </ul>

  <div class="wc-inner" #inner>
    <p class="wc-eyebrow">Welcome</p>

    <!-- Ba chữ H tự viết ra, lần lượt. Cùng kỹ thuật với khu câu chuyện: nét mờ
         có sẵn để chữ không phải một khoảng trống chờ hoạt ảnh, nét màu chạy đè
         lên. Ở đây chạy theo THỜI GIAN chứ không theo cuộn — đây là thứ đầu
         tiên người ta thấy, chưa ai cuộn gì cả. -->
    <div class="wc-glyphs" aria-hidden="true">
      <span class="wc-h tone-blue">
        <svg viewBox="0 0 100 124" fill="none">
          <path class="wc-track" d="M18 10V114M18 62H82M82 10V114" />
          <path class="wc-ink" pathLength="100" d="M18 10V114M18 62H82M82 10V114" />
        </svg>
      </span>
      <span class="wc-h tone-purple">
        <svg viewBox="0 0 100 124" fill="none">
          <path class="wc-track" d="M18 10V114M18 62H82M82 10V114" />
          <path class="wc-ink" pathLength="100" d="M18 10V114M18 62H82M82 10V114" />
        </svg>
      </span>
      <span class="wc-h tone-green">
        <svg viewBox="0 0 100 124" fill="none">
          <path class="wc-track" d="M18 10V114M18 62H82M82 10V114" />
          <path class="wc-ink" pathLength="100" d="M18 10V114M18 62H82M82 10V114" />
        </svg>
      </span>
    </div>

    <p class="wc-name">
      <span>Horizon</span>
      <span>Hub</span>
      <span>Harmony</span>
    </p>

    <p class="wc-line">
      A real-time board where a small team's work — and the conversation around it — finally live
      in the same place.
    </p>

    <!-- Ba chip: giới thiệu sơ chức năng ngay ở màn đầu, để người ta biết mình
         sắp cuộn vào cái gì. Đúng ba, không hơn — đây là tấm bìa, không phải

    <ul class="wc-chips">
      <li>Real-time board</li>

    <!-- Chỉ là hình, không phải liên kết. Cả khu vực mang `pointer-events: none`

      <span>Scroll</span>
