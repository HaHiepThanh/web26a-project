<!-- `max-[900px]:flex-col` KHÔNG phải trang trí: dưới 900px `<aside>` đổi sang
     `w-full`, mà nó lại `shrink-0` — để hàng ngang thì thanh điều hướng chiếm
     trọn bề rộng màn hình và đẩy hẳn `<main>` ra ngoài, rồi bị `overflow-hidden`
     của khung cha cắt mất, tức mất trắng phần nội dung. Xếp dọc mới đúng ý ban
     đầu (đã thấy qua `border-b` thay cho `border-r` ở dưới). -->
<div class="flex min-h-full flex-1 bg-base-200 text-base-content max-[900px]:flex-col">
  <!-- Toast Notification -->
  @if (toastMessage()) {
  <div class="toast toast-top toast-end z-[9999] pointer-events-none">
    <div
      class="alert text-xs shadow-xl pointer-events-auto flex items-center gap-2.5 py-2.5 px-4 rounded-2xl border text-white font-bold transition-all"
      [class.bg-success]="toastType() === 'success'" [class.border-success]="toastType() === 'success'"
      [class.bg-error]="toastType() === 'error'" [class.border-error]="toastType() === 'error'"
      [class.bg-neutral]="toastType() === 'info'" [class.border-base-300]="toastType() === 'info'">
      <span>{{ toastMessage() }}</span>
    </div>
  </div>
  }

  <!-- ============================== LEFT NAVIGATION ============================== -->
  <aside
    class="w-[280px] shrink-0 overflow-y-auto border-r border-base-300 bg-base-100 p-5 max-[900px]:w-full max-[900px]:border-b max-[900px]:border-r-0 max-lg:overflow-visible">
    <div class="px-2 pb-6 pt-1">
      <h1 class="text-xl font-black tracking-tight text-base-content">Settings</h1>
      <p class="mt-1 text-xs text-base-content/60">Manage your profile and Workspace members</p>
    </div>

    <!-- Tab điều hướng dùng .menu của daisyUI; tab đang mở là .menu-active. -->
    <ul class="menu w-full gap-1.5 p-0 max-[900px]:menu-horizontal max-[900px]:flex-nowrap max-[900px]:overflow-x-auto">
      @for (item of navItems; track item.id) {
      <!-- Ở khổ dọc `w-full` là đúng, nhưng khi thanh này nằm ngang thì `w-full`
           nghĩa là MỖI tab rộng bằng cả thanh — ba tab thành 300% bề rộng, người
           dùng phải kéo ngang mới thấy tab kế tiếp. Nằm ngang thì để tab tự co
           theo nội dung. -->
      <li class="w-full max-[900px]:w-auto">
        <button type="button" class="group flex w-full items-center gap-3 text-left"
          [class.menu-active]="activeTab() === item.id" (click)="onTabChange(item.id)">
          <span
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-lg transition-transform group-hover:scale-110"
            [class.bg-secondary]="activeTab() === item.id"
            [class.text-secondary-content]="activeTab() === item.id"
            [class.bg-base-200]="activeTab() !== item.id">
            @if (item.icon === 'user') {
            <svg lucideUser class="h-4 w-4" [strokeWidth]="2.2"></svg>
            } @else if (item.icon === 'building') {
            <svg lucideBuilding2 class="h-4 w-4" [strokeWidth]="2.2"></svg>
            } @else {
            <svg lucideUsers class="h-4 w-4" [strokeWidth]="2.2"></svg>
            }
          </span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-black leading-tight">{{ item.label }}</span>
            <!-- Câu mô tả dài gấp mấy lần nhãn; để nguyên khi thanh nằm ngang thì
                 ba tab không đời nào lọt màn hình điện thoại. Nhãn đủ để nhận ra
                 tab, mô tả chỉ là phần thêm nên ẩn ở khổ hẹp. -->
            <span class="block truncate text-2xs opacity-70 leading-tight mt-0.5 max-[900px]:hidden">{{ item.description }}</span>
          </span>
        </button>
      </li>
      }
    </ul>
  </aside>

  <!-- ============================== MAIN CONTENT ============================== -->
  <!-- `max-lg:overflow-visible`: khổ hẹp để trang cuộn, không dựng tầng cuộn riêng
       ở đây nữa (xem chú thích trong `app-layout.css`). -->
  <main class="flex-1 overflow-y-auto p-8 max-[900px]:p-4 max-lg:overflow-visible">
    @switch (activeTab()) {
    <!-- 1. TAB TRANG CÁ NHÂN -->
    @case ('profile') {
    <app-profile-tab [currentUser]="currentUser()" (saveProfile)="onSaveProfile($event)"
      (profileChanged)="onProfileChanged()"
      (flashMessage)="flash($event.message, $event.type ?? 'success')">
    </app-profile-tab>
    }

    <!-- 2. TAB MANAGE ORGANIZATION -->
    @case ('manage-organization') {
    <app-manage-organization-tab [organizations]="orgService.organizations()" [activeOrgId]="orgService.activeOrgId()"
      [activeOrg]="orgService.activeOrg()" [orgMembers]="orgMembers()"
      [currentUserId]="auth.currentUser()?.id ?? null" (switchOrg)="onSwitchOrg($event)"
      (createOrg)="onCreateOrg($event)"
      (inviteMember)="onInviteOrgMember($event)" (removeMember)="onRemoveOrgMember($event)" (changeRole)="onChangeOrgRole($event)"
      (flashMessage)="flash($event.message, $event.type ?? 'success')">
    </app-manage-organization-tab>
    }

    <!-- 3. TAB MANAGE WORKSPACE -->
    @case ('manage-workspace') {
    <app-manage-workspace-tab [organizations]="orgService.organizations()" [selectedOrgFilter]="selectedOrgFilter()"
      [workspaces]="workspaces()" [selectedWorkspaceId]="selectedWorkspaceId()" [searchableUsers]="searchableUsers()"
      (changeOrgFilter)="onOrgFilterChange($event)" (selectWorkspace)="onSelectWorkspace($event)"
      (addMember)="onAddWorkspaceMember($event)" (changeRole)="onChangeWorkspaceRole($event)"
      (removeMember)="onRemoveWorkspaceMember($event)" (flashMessage)="flash($event.message, $event.type ?? 'success')">
    </app-manage-workspace-tab>
    }
    }
  </main>
</div>
