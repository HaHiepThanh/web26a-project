<!-- TODO: bố cục app (đã đăng nhập). Gợi ý: Header trên cùng, sidebar workspace bên trái,
     nội dung ở giữa qua router-outlet, Footer dưới cùng. -->
<app-header />

<main class="flex flex-1 flex-col min-h-0 overflow-hidden">
  <router-outlet />
</main>

@if (!hideFooter()) {
  <app-footer class="shrink-0" />
}

<!-- Thanh thao tác nổi ở đáy. Hai điều kiện, tách bạch:
       - `hienThanhMobile()` — CHỈ ở trang Workspace (xem chú thích trong .ts).
       - `lg:hidden` bên trong component — chỉ từ `lg` trở xuống.

     Dùng `@if` chứ không phải ẩn bằng class: ở trang khác thì thanh không nên
     tồn tại chút nào. Ẩn bằng CSS thì các `effect`/subscribe bên trong vẫn chạy,
     và lớp phủ của nó vẫn có thể xuất hiện nếu trạng thái còn sót lại.

     Mốc `lg:hidden` nằm BÊN TRONG component chứ không đặt ở thẻ này: component
     có `:host { display: contents }`, mà luật đó không nằm trong @layer nào nên
     nó thắng utility `lg:hidden` của Tailwind — đặt ở đây thì thanh vẫn hiện
     trên máy tính. -->
@if (hienThanhMobile()) {
  <app-mobile-action-bar />
}

<!-- Tour hướng dẫn người dùng mới. Đặt ở layout chứ không ở từng trang: tour đi
     xuyên route (workspace → board), nằm trong trang là mất khi điều hướng. -->
<app-tour-invitation />
<app-tour-overlay />
<app-tour-prompt />
<app-tour-checklist />

<!-- Tầng 3: coach mark. Tách khỏi tour vì nó tự bật theo hoàn cảnh, không
     phải do người dùng gọi. -->
<app-coach-mark />
