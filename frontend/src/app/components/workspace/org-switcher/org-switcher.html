<div class="p-3.5">
  <!-- Section header -->
  <div class="mb-2.5 flex items-center justify-between px-0.5">
    <div class="flex items-center gap-1.5">
      <span class="flex h-5 w-5 items-center justify-center rounded-md bg-primary/10 text-primary">
        <svg lucideBuilding2 class="h-3 w-3" [strokeWidth]="2.4"></svg>
      </span>
      <span class="text-2xs font-bold uppercase tracking-wide text-base-content/45">Organization</span>
    </div>
    <span class="text-2xs font-bold text-base-content/35">{{ organizations().length }}</span>
  </div>

  <div class="space-y-1">
    @for (org of organizations(); track org.id) {
    <div class="group relative flex w-full items-center rounded-xl transition-all"
      [class]="org.id === activeOrg()?.id ? 'bg-primary shadow-sm text-primary-content' : 'hover:bg-base-200'">
      <button type="button" class="flex min-w-0 flex-1 items-center gap-2.5 px-2 py-1.5 text-left"
        (click)="onSelect(org.id)">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-sm text-white shadow-xs"
          [class]="iconClassFor(org.id)">
          {{ org.icon }}
        </span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-xs font-bold leading-tight">{{ org.name }}</span>
          <span class="block truncate text-2xs font-medium leading-tight"
            [class]="org.id === activeOrg()?.id ? 'text-primary-content/70' : 'text-base-content/45'">
            {{ org.memberIds.length }} thành viên
          </span>
        </span>
      </button>

      <div class="flex shrink-0 items-center gap-0.5 pr-1.5">
        @if (org.id === activeOrg()?.id) {
        <svg lucideCheck class="h-3.5 w-3.5 shrink-0 transition-opacity group-hover:opacity-0" [strokeWidth]="3"></svg>
        }
        <!-- 3 chấm: mở modal quản lý (mời/xoá thành viên, đổi tên) -->
        <button type="button"
          class="absolute right-1.5 flex h-6 w-6 items-center justify-center rounded-lg opacity-0 transition-all focus-visible:opacity-100 group-hover:opacity-100"
          [class]="org.id === activeOrg()?.id ? 'hover:bg-white/20' : 'hover:bg-base-300'"
          title="Quản lý tổ chức" [attr.aria-label]="'Quản lý ' + org.name" (click)="onManage(org.id, $event)">
          <svg lucideEllipsisVertical class="h-3.5 w-3.5" [strokeWidth]="2.4"></svg>
        </button>
      </div>
    </div>
    }
  </div>

  <!-- Tạo Organization mới -->
  @if (!creating()) {
  <button type="button"
    class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-xl border border-dashed border-base-300 py-1.5 text-2xs font-bold text-primary transition-all hover:border-primary hover:bg-primary/5"
    (click)="startCreate()">
    <svg lucidePlus class="h-3 w-3 shrink-0" [strokeWidth]="3"></svg>
    <span>Tạo tổ chức mới</span>
  </button>
  } @else {
  <div class="mt-2 flex flex-col gap-1.5 rounded-xl border border-base-300 bg-base-200/40 p-2">
    <input #nameInput type="text" class="input input-bordered input-sm w-full rounded-lg bg-base-100" placeholder="Tên tổ chức..."
      [ngModel]="newName()" (ngModelChange)="newName.set($event)" (keydown.enter)="submitCreate()"
      (keydown.escape)="cancelCreate()" />
    <div class="flex items-center gap-1.5">
      <button type="button" class="btn btn-primary btn-sm flex-1 rounded-lg" (click)="submitCreate()">Tạo</button>
      <button type="button" class="btn btn-ghost btn-sm rounded-lg" (click)="cancelCreate()">Huỷ</button>
    </div>
  </div>
  }
</div>
