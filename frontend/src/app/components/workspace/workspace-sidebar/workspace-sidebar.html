<div class="p-3.5">
  <!-- Section header -->
  <div class="mb-2 flex items-center justify-between px-0.5">
    <div class="flex items-center gap-1.5">
      <span class="flex h-5 w-5 items-center justify-center rounded bg-primary/10 text-primary">
        <svg lucideFolderKanban class="h-3 w-3" [strokeWidth]="2.4"></svg>
      </span>
      <span class="text-2xs font-bold uppercase tracking-wide text-base-content/50">Workspace</span>
    </div>
  </div>

  <ul class="flex flex-col w-full min-w-0 gap-1 p-0">
    <!-- Option: Tất cả Workspace -->
    <li class="min-w-0 w-full">
      <button type="button"
        class="flex w-full min-w-0 items-center justify-between gap-2.5 rounded-field p-2 text-left transition-all duration-150"
        [class]="activeWorkspaceId() === null ? 'bg-primary text-primary-content font-bold shadow-xs' : 'text-base-content hover:bg-base-200'"
        (click)="onSelectWorkspace(null)">
        <span class="flex min-w-0 items-center gap-2.5 overflow-hidden">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-field"
            [class]="activeWorkspaceId() === null ? 'bg-primary-content/20 text-primary-content' : 'bg-base-200 text-base-content/70'">
            <svg lucideFolderKanban class="h-3.5 w-3.5" [strokeWidth]="2"></svg>
          </span>
          <span class="truncate text-xs font-bold">All Workspaces</span>
        </span>
        <span class="badge badge-sm font-bold shrink-0"
          [class]="activeWorkspaceId() === null ? 'bg-primary-content/20 text-primary-content border-none' : 'badge-ghost text-base-content/70'">
          {{ totalBoardsCount() }}
        </span>
      </button>
    </li>

    <!-- Workspace items list -->
    @for (ws of workspaces(); track ws.id) {
    <li class="group relative min-w-0 w-full">
      <button type="button"
        class="flex w-full min-w-0 items-center justify-between gap-2 rounded-field p-2 text-left transition-all duration-150 pr-16"
        [class]="activeWorkspaceId() === ws.id ? 'bg-primary text-primary-content font-bold shadow-xs' : 'text-base-content hover:bg-base-200'"
        (click)="onSelectWorkspace(ws.id)">
        <span class="min-w-0 flex-1 overflow-hidden">
          <!-- Xuống dòng thay vì cắt cụt, kèm `break-words` cho tên một từ liền —
               lý do đầy đủ xem chú thích cùng chỗ trong `org-switcher.html`. -->
          <span class="line-clamp-3 break-words text-xs font-bold leading-tight" [title]="ws.name">{{ ws.name }}</span>
          <span class="block truncate text-2xs font-medium leading-tight"
            [class]="activeWorkspaceId() === ws.id ? 'text-primary-content/80' : 'text-base-content/55'">
            {{ ws.members.length }} member(s)
          </span>
        </span>
        <span class="badge badge-sm font-bold shrink-0 absolute right-9 top-1/2 -translate-y-1/2"
          [class]="activeWorkspaceId() === ws.id ? 'bg-primary-content/20 text-primary-content border-none' : 'badge-ghost text-base-content/70'">
          {{ ws.boards.length }}
        </span>
      </button>

      <!-- 3 chấm: mở modal quản lý workspace (đổi tên/icon, thành viên, xoá)
           Hiện suốt, vì lý do hệt nút bên OrgSwitcher — xem chú thích đầy đủ ở
           `org-switcher.html`. -->
      <button type="button"
        class="btn btn-ghost btn-xs btn-circle border-none absolute right-1.5 top-1/2 z-10 -translate-y-1/2 transition-all"
        [class]="activeWorkspaceId() === ws.id ? 'bg-white/25 text-white hover:bg-white/40 active:bg-white/50' : 'bg-base-200 text-base-content/70 hover:bg-base-300 hover:text-base-content'"
        title="Manage Workspace" [attr.aria-label]="'Manage ' + ws.name" (click)="onManage(ws, $event)">
        <svg lucideEllipsisVertical class="h-3.5 w-3.5" [strokeWidth]="2.4"></svg>
      </button>
    </li>
    }
  </ul>

  <!-- Nút Tạo Workspace mới (màu xanh Primary chuẩn) -->
  <button type="button" class="btn btn-dash btn-primary btn-sm mt-2 w-full gap-1.5 text-2xs font-bold"
    (click)="createWorkspace.emit()" [class.hidden]="!canManage()">
    <svg lucidePlus class="h-3 w-3 shrink-0" [strokeWidth]="3"></svg>
    <span>New Workspace</span>
  </button>
</div>
