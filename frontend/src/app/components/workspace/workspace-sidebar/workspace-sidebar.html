<div class="rounded-3xl border border-slate-200/90 dark:border-slate-800 bg-base-100 p-4 shadow-sm">
  <!-- Title Header -->
  <div class="mb-3 flex items-center justify-between px-1 pt-0.5">
    <div class="flex items-center gap-1.5">
      <span class="text-[12px] font-black uppercase tracking-wider text-slate-600 dark:text-slate-300">Không gian làm
        việc</span>
    </div>
  </div>

  <div class="space-y-1.5">
    <!-- Option: Tất cả Workspace -->
    <button type="button"
      class="w-full flex items-center justify-between rounded-2xl px-3 py-2.5 text-left text-[13px] font-black transition-all"
      [class.bg-purple-100/80]="activeWorkspaceId() === null"
      [class.dark:bg-purple-950/40]="activeWorkspaceId() === null" [class.border-2]="activeWorkspaceId() === null"
      [class.border-purple-300]="activeWorkspaceId() === null"
      [class.dark:border-purple-700]="activeWorkspaceId() === null"
      [class.text-purple-700]="activeWorkspaceId() === null" [class.dark:text-purple-300]="activeWorkspaceId() === null"
      [class.text-slate-800]="activeWorkspaceId() !== null" [class.dark:text-slate-200]="activeWorkspaceId() !== null"
      [class.hover:bg-slate-100]="activeWorkspaceId() !== null"
      [class.dark:hover:bg-slate-800]="activeWorkspaceId() !== null" (click)="onSelectWorkspace(null)">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="text-base shrink-0">🗂️</span>
        <span class="truncate font-black">Tất cả Workspace</span>
      </div>
      <span class="flex h-5 min-w-5 px-1.5 items-center justify-center rounded-full text-[11px] font-black shrink-0"
        [class.bg-purple-700]="activeWorkspaceId() === null" [class.text-white]="activeWorkspaceId() === null"
        [class.text-slate-600]="activeWorkspaceId() !== null"
        [class.dark:text-slate-400]="activeWorkspaceId() !== null">
        {{ totalBoardsCount() }}
      </span>
    </button>

    <!-- Workspace items list -->
    @for (ws of workspaces(); track ws.id) {
    <button type="button"
      class="w-full flex items-center justify-between rounded-2xl px-3 py-2 text-left text-[13px] font-bold transition-all"
      [class.bg-purple-100/80]="activeWorkspaceId() === ws.id"
      [class.dark:bg-purple-950/40]="activeWorkspaceId() === ws.id" [class.border-2]="activeWorkspaceId() === ws.id"
      [class.border-purple-300]="activeWorkspaceId() === ws.id"
      [class.dark:border-purple-700]="activeWorkspaceId() === ws.id"
      [class.text-purple-700]="activeWorkspaceId() === ws.id"
      [class.dark:text-purple-300]="activeWorkspaceId() === ws.id"
      [class.text-slate-800]="activeWorkspaceId() !== ws.id" [class.dark:text-slate-200]="activeWorkspaceId() !== ws.id"
      [class.hover:bg-slate-100]="activeWorkspaceId() !== ws.id"
      [class.dark:hover:bg-slate-800]="activeWorkspaceId() !== ws.id" (click)="onSelectWorkspace(ws.id)">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Circular avatar colored icon -->
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs shadow-xs"
          [class]="ws.iconBg">
          {{ ws.icon }}
        </span>
        <span class="truncate font-bold text-[13px]">{{ ws.name }}</span>
      </div>
      <span class="flex h-5 min-w-5 px-1.5 items-center justify-center rounded-full text-[11px] font-bold shrink-0"
        [class.bg-purple-700]="activeWorkspaceId() === ws.id" [class.text-white]="activeWorkspaceId() === ws.id"
        [class.text-slate-600]="activeWorkspaceId() !== ws.id"
        [class.dark:text-slate-400]="activeWorkspaceId() !== ws.id">
        {{ ws.boards.length }}
      </span>
    </button>
    }
  </div>

  <div class="my-2.5 border-t border-slate-100 dark:border-slate-800"></div>

  <div class="flex w-full items-center">
    <button type="button"
      class="inline-flex items-center gap-1.5 px-1 py-1 text-xs font-black text-primary hover:underline transition-all"
      (click)="createWorkspace.emit()">
      <svg class="h-3.5 w-3.5 shrink-0 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Tạo Không gian mới</span>
    </button>
  </div>
</div>
