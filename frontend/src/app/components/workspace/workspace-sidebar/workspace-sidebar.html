<div class="p-3.5">
  <!-- Section header -->
  <div class="mb-2.5 flex items-center justify-between px-0.5">
    <div class="flex items-center gap-1.5">
      <span class="flex h-5 w-5 items-center justify-center rounded-md bg-primary/10 text-primary">
        <svg lucideFolderKanban class="h-3 w-3" [strokeWidth]="2.4"></svg>
      </span>
      <span class="text-2xs font-bold uppercase tracking-wide text-base-content/45">Không gian làm việc</span>
    </div>
  </div>

  <div class="space-y-1">
    <!-- Option: Tất cả Workspace -->
    <button type="button"
      class="flex w-full items-center justify-between rounded-xl px-2 py-1.5 text-left transition-all"
      [class]="activeWorkspaceId() === null ? 'bg-primary shadow-sm text-primary-content' : 'hover:bg-base-200'"
      (click)="onSelectWorkspace(null)">
      <div class="flex min-w-0 items-center gap-2.5">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-base-300/70">
          <svg lucideFolderKanban class="h-4 w-4" [strokeWidth]="2"></svg>
        </span>
        <span class="truncate text-xs font-bold">Tất cả Workspace</span>
      </div>
      <span class="flex h-5 min-w-5 shrink-0 items-center justify-center rounded-full px-1.5 text-2xs font-bold"
        [class]="activeWorkspaceId() === null ? 'bg-white/20' : 'bg-base-300/70 text-base-content/60'">
        {{ totalBoardsCount() }}
      </span>
    </button>

    <!-- Workspace items list -->
    @for (ws of workspaces(); track ws.id) {
    <button type="button"
      class="flex w-full items-center justify-between rounded-xl px-2 py-1.5 text-left transition-all"
      [class]="activeWorkspaceId() === ws.id ? 'bg-primary shadow-sm text-primary-content' : 'hover:bg-base-200'"
      (click)="onSelectWorkspace(ws.id)">
      <div class="flex min-w-0 items-center gap-2.5">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-sm text-white shadow-xs"
          [class]="ws.iconBg">
          {{ ws.icon }}
        </span>
        <span class="truncate text-xs font-bold">{{ ws.name }}</span>
      </div>
      <span class="flex h-5 min-w-5 shrink-0 items-center justify-center rounded-full px-1.5 text-2xs font-bold"
        [class]="activeWorkspaceId() === ws.id ? 'bg-white/20' : 'bg-base-300/70 text-base-content/60'">
        {{ ws.boards.length }}
      </span>
    </button>
    }
  </div>

  <button type="button"
    class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-xl border border-dashed border-base-300 py-1.5 text-2xs font-bold text-primary transition-all hover:border-primary hover:bg-primary/5"
    (click)="createWorkspace.emit()">
    <svg lucidePlus class="h-3 w-3 shrink-0" [strokeWidth]="3"></svg>
    <span>Tạo Không gian mới</span>
  </button>
</div>
