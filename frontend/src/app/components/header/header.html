<header
  class="sticky top-0 z-[100] flex h-[52px] items-center justify-between gap-3 border-b border-base-300 bg-base-200 px-2.5 shadow-sm">
  <a routerLink="/workspace"
    class="flex shrink-0 items-center gap-1.5 rounded-md px-1.5 py-1 font-bold text-base-content hover:bg-base-300">
    <div
      class="flex h-5 w-5 items-center justify-center gap-0.5 rounded bg-gradient-to-br from-[#0052cc] to-[#0747a6] p-[3px]">
      <div class="h-[12px] w-[6px] rounded-[1px] bg-white"></div>
      <div class="mt-0.5 h-[8px] w-[6px] self-start rounded-[1px] bg-white"></div>
    </div>
    <div class="flex flex-col leading-[1.05]">
      <span class="text-[15px] tracking-[-0.3px] text-primary">Trello</span>
      <span class="text-[8px] font-extrabold tracking-[0.6px] text-base-content/50">WORKSPACE</span>
    </div>
  </a>

  <div class="max-w-[520px] flex-1 max-md:hidden">
    <div class="group relative w-full">
      <svg
        class="pointer-events-none absolute left-2.5 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-base-content/40 transition-colors group-focus-within:text-primary"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text"
        class="input input-sm h-8 w-full appearance-none rounded-lg border-2 border-base-content/20 !bg-base-100 pl-8 pr-8 text-[13px] shadow transition-colors focus:border-primary"
        placeholder="Tìm kiếm bảng dự án..." (input)="onSearchInput($event)" />
      <span class="kbd kbd-sm pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 opacity-60">/</span>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-1.5">
    <button class="btn btn-primary btn-sm gap-1.5 px-3" (click)="requestCreateBoard()">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="max-sm:hidden">Tạo</span>
    </button>

    <div class="mx-0.5 h-5 w-px bg-base-300 max-sm:hidden"></div>

    <button class="btn btn-ghost btn-circle btn-sm" (click)="toggleTheme()"
      [title]="theme() === 'dark' ? 'Chuyển giao diện sáng' : 'Chuyển giao diện tối'">
      @if (theme() === 'dark') {
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        </svg>
      }
    </button>

    <button class="btn btn-ghost btn-circle btn-sm relative"
      [title]="dueBadgeCount() > 0 ? dueBadgeCount() + ' thẻ của bạn sắp/đã quá hạn' : 'Thông báo'">
      <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 01-3.4 0" />
      </svg>
      @if (dueBadgeCount() > 0) {
        <span
          class="badge badge-error absolute -right-0.5 -top-0.5 h-[15px] min-w-[15px] rounded-full border-2 border-base-200 px-1 text-[9px] font-bold text-white">{{
          dueBadgeCount() }}</span>
      }
    </button>

    <a class="btn btn-ghost btn-circle btn-sm" routerLink="/settings" title="Cài đặt">
      <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
      </svg>
    </a>

    <div
      class="ml-0.5 flex cursor-pointer items-center gap-1 rounded-full border border-base-300 bg-base-100 py-[2px] pl-1 pr-1.5 transition-colors hover:bg-base-300"
      (click)="toggleUserMenu()">
      <div
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-[#2563eb] to-[#1d4ed8] text-[11px] font-bold text-white">
        {{ initials() }}</div>
      <span class="max-w-[120px] truncate text-[12.5px] font-semibold text-base-content max-md:hidden">{{
        currentUser()?.displayName ?? currentUser()?.email ?? 'Khách' }}</span>
      <svg class="h-3 w-3 shrink-0 text-base-content/40 max-md:hidden" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5">
        <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <div
    class="absolute right-2.5 top-[52px] z-[200] mt-1 w-[260px] rounded-box border border-base-300 bg-base-100 p-2 shadow-lg"
    [class.hidden]="!menuOpen()">
    <div class="px-3 pt-2 text-[13px] font-bold text-base-content">Tài khoản</div>
    <div class="px-3 pb-2 text-xs text-base-content/50">{{ currentUser()?.email ?? '—' }}</div>
    <div class="my-1 h-px bg-base-300"></div>
    <a class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-[13px] text-base-content hover:bg-base-200"
      routerLink="/settings">👤 Hồ sơ và quyền riêng tư</a>
    <a class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-[13px] text-base-content hover:bg-base-200"
      routerLink="/workspace">🗂️ Không gian làm việc</a>
    <a class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-[13px] text-base-content hover:bg-base-200"
      routerLink="/members">👥 Thành viên</a>
    <div class="my-1 h-px bg-base-300"></div>
    <div class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-[13px] text-error hover:bg-base-200"
      (click)="logout()">🚪 Đăng xuất</div>
  </div>
</header>
