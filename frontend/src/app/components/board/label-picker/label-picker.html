<div class="mb-2 flex max-h-40 flex-col gap-0.5 overflow-y-auto">
  @for (lb of labels(); track lb.id) {
    <label class="flex cursor-pointer items-center gap-2 rounded-md px-1 py-1.5 hover:bg-base-200">
      <input type="checkbox" class="sr-only" [checked]="isSelected(lb.id)" (change)="toggle(lb.id)" />
      <span class="flex h-5 w-[30px] shrink-0 items-center justify-center rounded-[5px] text-white" [style.background]="lb.color">
        @if (isSelected(lb.id)) {
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        }
      </span>
      <span class="text-xs font-medium text-base-content">{{ lb.name }}</span>
    </label>
  }
  @if (labels().length === 0) {
    <div class="px-0.5 py-1.5 text-2xs text-base-content/50">This board has no labels yet — create the first one below.</div>
  }
</div>

@if (!showCreateForm()) {
  <button type="button" class="btn btn-ghost btn-xs gap-1 px-1 text-2xs font-semibold" (click)="openCreateForm()">
    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    New label
  </button>
} @else {
  <div class="rounded-md border border-dashed border-base-300 p-2">
    <input
      type="text"
      class="input input-sm mb-2 w-full"
      placeholder="Label name..."
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      (keydown.enter)="submitCreateForm()"
    />
    <div class="mb-2 flex flex-wrap gap-1.5">
      @for (c of palette; track c) {
        <button type="button" class="btn btn-circle btn-xs h-5 min-h-0 w-5 border-2 border-transparent p-0" [style.background]="c" [class.border-base-content]="newColor() === c" (click)="newColor.set(c)"></button>
      }
    </div>
    @if (isDuplicateColor()) {
      <div class="mb-2 flex items-center gap-1 text-3xs font-semibold text-warning">
        <svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01M10.3 3.9L2.5 17a1.8 1.8 0 001.5 2.7h16a1.8 1.8 0 001.5-2.7L13.7 3.9a1.8 1.8 0 00-3.4 0z"/></svg>
        Another label already uses this color.
      </div>
    }
    <div class="flex justify-end gap-1.5">
      <button type="button" class="btn btn-ghost btn-xs" (click)="cancelCreateForm()">Cancel</button>
      <button type="button" class="btn btn-primary btn-xs" [disabled]="!newName().trim()" (click)="submitCreateForm()">Create label</button>
    </div>
  </div>
}
