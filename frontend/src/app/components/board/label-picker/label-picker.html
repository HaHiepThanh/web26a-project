<div class="picker-list">
  @for (lb of labels(); track lb.id) {
    <label class="picker-item" [class.checked]="isSelected(lb.id)">
      <input type="checkbox" [checked]="isSelected(lb.id)" (change)="toggle(lb.id)" />
      <span class="picker-swatch" [style.background]="lb.color">
        @if (isSelected(lb.id)) {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        }
      </span>
      <span class="picker-name">{{ lb.name }}</span>
    </label>
  }
  @if (labels().length === 0) {
    <div class="picker-empty">Board chưa có nhãn nào — tạo nhãn đầu tiên bên dưới.</div>
  }
</div>

@if (!showCreateForm()) {
  <button type="button" class="create-toggle-btn" (click)="openCreateForm()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Tạo nhãn mới
  </button>
} @else {
  <div class="create-form">
    <input
      type="text"
      class="create-name-input"
      placeholder="Tên nhãn..."
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
      (keydown.enter)="submitCreateForm()"
    />
    <div class="create-color-row">
      @for (c of palette; track c) {
        <button type="button" class="create-swatch" [style.background]="c" [class.selected]="newColor() === c" (click)="newColor.set(c)"></button>
      }
    </div>
    <div class="create-actions">
      <button type="button" class="create-cancel" (click)="cancelCreateForm()">Huỷ</button>
      <button type="button" class="create-save" [disabled]="!newName().trim()" (click)="submitCreateForm()">Tạo nhãn</button>
    </div>
  </div>
}
