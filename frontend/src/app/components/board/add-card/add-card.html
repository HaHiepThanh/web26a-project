<button
  type="button"
  data-tour="add-card"
  class="btn btn-ghost btn-sm w-full cursor-pointer justify-start gap-1.5 px-2 text-[12px] font-semibold text-base-content/70 transition-colors hover:bg-base-300 hover:text-base-content focus-visible:bg-base-300 focus-visible:text-base-content disabled:cursor-progress disabled:opacity-60 disabled:hover:bg-transparent"
  [disabled]="creating()"
  (click)="open.emit()"
>
  @if (creating()) {
    <span class="loading loading-spinner h-3 w-3"></span>
    Adding card…
  } @else {
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    Add card
  }
</button>
