<div class="flex items-center justify-between gap-1.5 px-2 pb-1.5 pt-2">
  <span class="flex min-w-0 flex-1 items-center">
    <input
      class="w-full min-w-0 rounded bg-transparent px-1 py-0.5 text-sm font-bold text-base-content/80 outline-none hover:bg-base-300 hover:text-base-content focus:bg-base-300 focus:text-base-content"
      [value]="list().name"
      spellcheck="false"
      (change)="onNameChange($event)"
    />
  </span>

  <span class="relative flex shrink-0 items-center gap-1">
    <span class="badge badge-ghost badge-sm">{{ cardCount() }}</span>
    <button class="btn btn-square btn-ghost btn-xs relative rounded-[8px] before:absolute before:-inset-1 before:content-['']" (click)="collapseToggle.emit()" title="Thu gọn danh sách" aria-label="Thu gọn danh sách">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="btn btn-square btn-ghost btn-xs relative rounded-[8px] before:absolute before:-inset-1 before:content-['']" (click)="toggleMenu()" aria-label="Tuỳ chọn danh sách">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>

    @if (menuOpen()) {
      <ul class="menu absolute right-0 top-7 z-10 min-w-[140px] rounded-box bg-base-100 p-1 shadow-md">
        <li><button class="text-error" (click)="onDeleteClick()">Xoá danh sách</button></li>
      </ul>
    }
  </span>
</div>
