@if (collapsed()) {
  <!-- Ô thu gọn = MỘT container duy nhất: grip (chiếu từ board.html qua khe
       [listGripCollapsed] riêng) + nút mở lại, cùng nằm trong một mặt nền bo
       góc. Grip phải dùng khe riêng chứ không dùng chung [listGrip] của nhánh
       mở rộng: Angular chỉ rót nội dung vào <ng-content> ĐẦU TIÊN khớp selector,
       nên hai khe trùng selector thì khe thứ hai luôn rỗng. -->
  <div class="collapsed-tile overflow-hidden rounded-box bg-base-100/90 shadow-md backdrop-blur-sm"
       [class.collapsed-tile--row]="orientation() === 'row'"
       [class.collapsed-tile--column]="orientation() === 'column'">
    <ng-content select="[listGripCollapsed]" />

    <button type="button" class="collapsed-open" (click)="toggleCollapse.emit()"
            [title]="'Expand list ' + list().name"
            [attr.aria-label]="'Expand list ' + list().name">
      <svg class="h-3.5 w-3.5 shrink-0 text-base-content/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>

      @if (orientation() === 'row') {
        <span class="min-w-0 flex-1 truncate text-left text-xs font-bold text-base-content/85">{{ list().name }}</span>
      } @else {
        <span class="collapsed-title">{{ list().name }}</span>
      }

      <span class="badge badge-ghost badge-sm shrink-0 px-1.5 text-2xs font-medium text-base-content/60">{{ cardCountLabel() }}</span>
    </button>
  </div>
} @else {
  <!-- `max-h-full` CHỈ cho chế độ cột: cột cần bám trần khung board rồi tự cuộn
       dọc bên trong. Chế độ hàng thì ngược lại — hàng phải cao đúng bằng thẻ cao
       nhất, ghim trần vào đây là thẻ bị cắt cụt. -->
  <!-- `rounded-box` đủ 4 góc. Trên main có commit bỏ bo góc TRÊN
       (`rounded-b-box rounded-t-none`) để list khớp liền với thanh grip nằm đè
       phía trên — nhưng thanh grip đó đã không còn: grip giờ nằm TRONG header
       của chính list này, nên góc trên không còn gì để khớp và phải bo lại. -->
  <div class="flex w-full flex-col overflow-hidden rounded-box bg-base-100/90 shadow-md backdrop-blur-sm"
       [class.max-h-full]="orientation() === 'column'">
    <!-- Grip kéo-thả do board.html khai báo rồi chiếu vào đây: nó phải là con
         (content) của phần tử cdkDrag để CDK nhận ra handle, nhưng phải NẰM
         TRONG khung bo góc của list thì mới không trông như một thanh rời. -->
    <div class="list-head-row">
      <ng-content select="[listGrip]" />
      <app-list-header
        [list]="list()"
        [cardCount]="cards().length"
        (rename)="renameList.emit($event)"
        (deleteList)="deleteList.emit()"
        (collapseToggle)="toggleCollapse.emit()"
      />
    </div>

    <div
      appFlipReorder
      class="list-cards flex gap-2 px-2"
      [class.is-column]="orientation() === 'column'"
      [class.flex-col]="orientation() === 'column'"
      [class.overflow-y-auto]="orientation() === 'column'"
      [class.overflow-x-hidden]="orientation() === 'column'"
      [class.flex-row]="orientation() === 'row'"
      [class.items-start]="orientation() === 'row'"
      [class.overflow-x-auto]="orientation() === 'row'"
      [class.py-2]="orientation() === 'row'"
      cdkDropList
      [id]="list().id"
      [cdkDropListData]="cards()"
      [cdkDropListOrientation]="orientation() === 'row' ? 'horizontal' : 'vertical'"
      [cdkDropListSortingDisabled]="!sortingEnabled()"
      (cdkDropListDropped)="onCardDrop($event)"
    >
      @for (card of cards(); track trackByCardId($index, card)) {
        <div class="card-drag-wrap cursor-grab active:cursor-grabbing" [attr.data-flip-id]="card.id" [class.row-card]="orientation() === 'row'" cdkDrag [cdkDragData]="card" (click)="onCardClick($event, card)">
          <div class="drag-placeholder" *cdkDragPlaceholder></div>
          <app-card-item
            [card]="card"
            [labels]="labelsByCardId()[card.id] ?? []"
            [assignee]="card.assigneeId ? (membersById()[card.assigneeId] ?? null) : null"
            [isSaving]="savingCardIds().has(card.id)"
            [isError]="errorCardIds().has(card.id)"
            [isDimmed]="dimmed().has(card.id)"
            [isHighlighted]="highlighted().has(card.id)"
            [isSelected]="selectedCardIds().has(card.id)"
            [today]="today()"
            [checklistProgress]="checklistProgressByCardId()[card.id] ?? null"
            [commentCount]="commentCountByCardId()[card.id] ?? 0"
            [coverUrl]="coverUrlByCardId()[card.id] ?? null"
            [attachmentCount]="attachmentCountByCardId()[card.id] ?? 0"
            (toggleComplete)="toggleComplete.emit($event)"
          />
        </div>
      }

      @if (orientation() === 'row') {
        <div class="add-card-row shrink-0">
          <app-add-card [creating]="creatingCard()" (open)="addCard.emit()" />
        </div>
      }
    </div>

    @if (orientation() === 'column') {
      <div class="shrink-0 px-2 pb-2 pt-1">
        <app-add-card [creating]="creatingCard()" (open)="addCard.emit()" />
      </div>
    }
  </div>
}
