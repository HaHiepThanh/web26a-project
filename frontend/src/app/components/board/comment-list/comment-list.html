<label class="mb-1.5 block text-2xs font-bold uppercase tracking-wide text-base-content/50">
  Comments
  @if (comments().length > 0) {
    <span class="normal-case tracking-normal text-base-content/40">({{ comments().length }})</span>
  }
</label>

@if (comments().length > 0) {
  <div class="mb-2.5 flex max-h-[220px] flex-col gap-2.5 overflow-y-auto">
    @for (c of comments(); track c.id) {
      <div class="group flex gap-2">
        <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-3xs font-bold text-white" [style.background]="userColor(c.userId)">{{ userInitials(c.userId) }}</span>
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline gap-1.5">
            <span class="text-2xs font-semibold text-base-content/80">{{ userLabel(c.userId) }}</span>
            <span class="text-3xs text-base-content/40">{{ timeLabel(c.createdAt) }}</span>
            @if (c.userId === currentUserId()) {
              <button type="button" class="btn btn-link btn-xs ml-auto h-auto min-h-0 p-0 text-3xs text-base-content/40 no-underline opacity-0 transition-opacity hover:text-error group-hover:opacity-100" (click)="deleteComment(c.id)">
                Delete
              </button>
            }
          </div>
          <div class="mt-0.5 whitespace-pre-wrap break-words rounded-md rounded-tl-sm bg-base-200 px-2.5 py-1.5 text-xs text-base-content">{{ c.content }}</div>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="mb-2.5 text-2xs text-base-content/50">No comments yet.</div>
}

<div class="flex gap-1.5">
  <div class="min-w-0 flex-1">
    <textarea
      class="textarea resize-none w-full text-xs"
      [class.textarea-error]="tooLong()"
      rows="2"
      placeholder="Write a comment..."
      [attr.maxlength]="maxLength"
      [attr.aria-describedby]="showCounter() ? 'comment-counter' : null"
      [value]="newCommentText()"
      (input)="onInput($event)"
      (keydown.enter)="$event.preventDefault(); addComment()"
    ></textarea>
    <!-- Chỉ hiện khi sắp chạm trần: ô nhập này nhỏ, đếm suốt từ ký tự đầu chỉ
         tổ chật chỗ mà lúc đó chẳng ai cần biết. -->
    @if (showCounter()) {
      <div
        id="comment-counter"
        class="mt-0.5 text-right text-2xs tabular-nums"
        [class]="tooLong() ? 'text-error font-semibold' : 'text-base-content/50'"
        aria-live="polite"
      >
        {{ remaining() }} characters left
      </div>
    }
  </div>
  <button type="button" class="btn btn-square btn-primary btn-sm self-start" [disabled]="!canSend()" (click)="addComment()" aria-label="Send comment">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
  </button>
</div>
