<label class="mb-1.5 flex items-center gap-1.5 text-xs font-bold text-base-content">
  <svg class="h-3.5 w-3.5 text-base-content/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
  Comments
  @if (comments().length > 0) {
    <span class="normal-case tracking-normal font-normal text-xs text-base-content/50">({{ comments().length }})</span>
  }
</label>

@if (comments().length > 0) {
  <div class="mb-2.5 flex max-h-[160px] flex-col gap-2.5 overflow-y-auto pr-1">
    @for (c of comments(); track c.id) {
      <div class="group flex gap-2">
        <app-user-avatar [userId]="c.userId" [name]="displayNameOf(c)" [avatarUrl]="avatarUrlOf(c)" [size]="24" extraClass="mt-0.5 shrink-0" />
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline gap-1.5">
            <span class="text-2xs font-semibold text-base-content/80">{{ displayNameOf(c) }}</span>
            <span class="text-3xs text-base-content/40">{{ timeLabel(c.createdAt) }}</span>
            @if (c.userId === currentUserId()) {
              <button type="button" class="btn btn-link btn-xs ml-auto h-auto min-h-0 p-0 text-3xs text-base-content/40 no-underline opacity-0 transition-opacity hover:text-error group-hover:opacity-100 font-bold" (click)="deleteComment(c.id)">
                Delete
              </button>
            }
          </div>
          <div class="mt-0.5 whitespace-pre-wrap break-words rounded-md bg-base-200 px-2.5 py-1.5 text-xs text-base-content">{{ c.content }}</div>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="mb-2.5 text-2xs text-base-content/50">No comments yet.</div>
}

<div class="flex items-center gap-1.5">
  <div class="min-w-0 flex-1">
    <input
      type="text"
      class="input input-bordered h-10 w-full rounded-md text-xs font-medium focus:border-primary focus:outline-none"
      [class.input-error]="tooLong()"
      placeholder="Write a comment..."
      [attr.maxlength]="maxLength"
      [attr.aria-describedby]="showCounter() ? 'comment-counter' : null"
      [value]="newCommentText()"
      (input)="onInput($event)"
      (keydown.enter)="$event.preventDefault(); addComment()"
    />
    @if (showCounter()) {
      <div
        id="comment-counter"
        class="mt-0.5 text-right text-2xs tabular-nums"
        [class]="tooLong() ? 'text-error font-semibold' : 'text-base-content/50'"
        aria-live="polite"
      >
        {{ remaining() }} characters left
      </div>
    }
  </div>
  <button
    type="button"
    class="btn btn-primary btn-square h-10 w-10 min-h-0 shrink-0 rounded-md font-bold"
    [disabled]="!canSend()"
    (click)="addComment()"
    aria-label="Send comment"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
    </svg>
  </button>
</div>
