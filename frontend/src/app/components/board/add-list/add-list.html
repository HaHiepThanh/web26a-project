@if (!editing()) {
  <button
    type="button"
    class="flex w-full items-center justify-center gap-1.5 rounded-[12px] border-[1.5px] border-dashed border-base-300 bg-base-200 p-3 text-[12px] font-semibold text-base-content/50 transition-colors hover:border-base-content/40 hover:bg-base-300 hover:text-base-content/70"
    (click)="startEditing()"
  >
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Thêm danh sách
  </button>
} @else {
  <div class="flex flex-col gap-1.5 rounded-box border border-base-300 bg-base-100 p-1.5 shadow-sm">
    <input
      #nameInput
      type="text"
      class="input input-bordered input-sm w-full text-[12px]"
      placeholder="Nhập tên danh sách..."
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      (keydown.enter)="submit()"
      (keydown.escape)="cancel()"
    />
    <div class="flex items-center gap-1.5">
      <button type="button" class="btn btn-primary btn-sm" (click)="submit()">Thêm danh sách</button>
      <button type="button" class="btn btn-ghost btn-sm btn-square" (click)="cancel()" aria-label="Huỷ">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
}
