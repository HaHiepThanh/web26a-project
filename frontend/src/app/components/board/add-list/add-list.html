@if (!editing()) {
  <button
    type="button"
    class="group flex w-full items-center gap-2.5 rounded-box border border-base-300/80 bg-base-100/80 px-4 py-3 text-xs font-bold text-base-content shadow-md backdrop-blur-md transition-all duration-200 hover:border-primary/60 hover:bg-base-100 hover:shadow-xl active:scale-[0.98]"
    (click)="startEditing()"
  >
    <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg bg-primary text-primary-content shadow-xs transition-transform duration-200 group-hover:scale-110">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
    </span>
    <span class="font-bold tracking-tight text-base-content transition-colors group-hover:text-primary">Add another list</span>
  </button>
} @else {
  <div class="flex flex-col gap-2.5 rounded-box border border-primary/40 bg-base-100 p-3 shadow-xl backdrop-blur-md ring-2 ring-primary/15 transition-all">
    <input
      #nameInput
      type="text"
      class="input input-bordered input-sm h-9 w-full rounded-lg text-xs font-semibold text-base-content placeholder:text-base-content/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
      placeholder="Enter list name..."
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      (keydown.enter)="submit()"
      (keydown.escape)="cancel()"
    />
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="btn btn-primary btn-sm h-8 gap-1.5 rounded-lg px-3 text-xs font-bold shadow-xs"
        (click)="submit()">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
        Add list
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square h-8 w-8 min-h-0 rounded-lg text-base-content/60 hover:bg-base-200 hover:text-base-content"
        (click)="cancel()"
        aria-label="Cancel">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
}
