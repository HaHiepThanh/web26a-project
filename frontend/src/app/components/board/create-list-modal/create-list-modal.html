@if (isOpen()) {
<div class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/45 backdrop-blur-[2px]" (click)="close.emit()">
  <div class="max-h-[88vh] w-80 max-w-[90%] overflow-y-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-base-100 p-5 shadow-2xl" (click)="$event.stopPropagation()">
    <div class="mb-3.5 text-base font-black text-slate-900 dark:text-white">Tạo danh sách mới</div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3.5">
        <label class="mb-1.5 block text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300" for="list-name-input">
          Tên danh sách <span class="text-error">*</span>
        </label>
        <input
          type="text"
          id="list-name-input"
          class="input input-bordered border-2 border-slate-300 dark:border-slate-600 focus:border-primary focus:ring-2 focus:ring-primary/20 input-sm w-full rounded-xl font-bold"
          placeholder="Vd: Chờ kiểm thử, Sprint Backlog..."
          [ngModel]="listName()"
          (ngModelChange)="listName.set($event)"
          name="listName"
          autofocus
        />
      </div>

      <div class="mb-4">
        <label class="mb-1.5 block text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300">Màu danh sách</label>
        <div class="flex flex-wrap gap-2">
          @for (c of listColors; track c) {
            <button
              type="button"
              class="flex h-6 w-6 items-center justify-center rounded-full border-2 border-transparent text-white transition hover:scale-110 shadow-xs"
              [style.background]="c"
              [class.ring-2]="listColor() === c"
              [class.ring-primary]="listColor() === c"
              [class.ring-offset-2]="listColor() === c"
              (click)="listColor.set(c)">
              @if (listColor() === c) {
                <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
              }
            </button>
          }
        </div>
      </div>

      <div class="mt-4 flex justify-end gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
        <button type="button" class="btn btn-ghost btn-sm rounded-xl font-bold" (click)="close.emit()">Huỷ</button>
        <button type="submit" class="btn btn-primary btn-sm rounded-xl font-black px-4 shadow-sm" [disabled]="!listName().trim()">
          Tạo danh sách
        </button>
      </div>
    </form>
  </div>
</div>
}
