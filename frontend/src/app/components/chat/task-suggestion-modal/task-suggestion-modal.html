<div class="modal modal-open z-[1100] p-4" (click)="close.emit()">
  <div class="modal-box flex max-h-[88vh] w-full max-w-3xl flex-col overflow-hidden rounded-md p-0"
    (click)="$event.stopPropagation()">

    <div class="flex shrink-0 items-start justify-between border-b border-base-200 px-5 py-3.5">
      <div class="min-w-0">
        <div class="flex items-center gap-1.5 text-sm font-bold text-base-content">
          <svg class="h-4 w-4 text-[var(--accent-purple)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z" />
          </svg>
          AI suggested {{ rows().length }} card(s)
        </div>
        <p class="mt-0.5 text-2xs text-base-content/55">
          Edit anything before creating. Untick the cards you don't want.
        </p>
      </div>
      <button type="button" class="btn btn-circle btn-ghost btn-sm shrink-0" (click)="close.emit()" aria-label="Close">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="flex flex-col gap-3 overflow-y-auto px-5 py-4">
      @for (r of rows(); track $index) {
        <div class="rounded-md border-2 p-3 transition"
          [class.border-primary]="r.chon"
          [class.border-base-300]="!r.chon"
          [class.opacity-55]="!r.chon">

          <div class="mb-2.5 flex items-center gap-2">
            <input type="checkbox" class="checkbox checkbox-primary checkbox-sm rounded-md shrink-0"
              [checked]="r.chon" (change)="toggle($index)" [attr.aria-label]="'Create card ' + r.title" />
            <input type="text" maxlength="200"
              class="input input-sm min-w-0 flex-1 rounded-md font-bold"
              placeholder="Card title" [ngModel]="r.title"
              (ngModelChange)="patch($index, { title: $event })" [name]="'title' + $index" />
          </div>

          <div class="grid grid-cols-1 gap-2 sm:grid-cols-4">
            <label class="min-w-0">
              <span class="mb-1 block text-3xs font-bold uppercase tracking-wide text-base-content/50">Assignee</span>
              <select class="select select-sm w-full max-w-full rounded-md truncate pr-8"
                [ngModel]="r.assigneeId ?? ''" (ngModelChange)="patch($index, { assigneeId: $event })"
                [name]="'assignee' + $index">
                <option value="">Unassigned</option>
                @for (m of members(); track m.id) {
                  <option [value]="m.id" [title]="m.displayName || m.email">
                    {{ formatShortName(m.displayName || m.email, 15) }}
                  </option>
                }
              </select>
            </label>

            <label class="min-w-0">
              <span class="mb-1 block text-3xs font-bold uppercase tracking-wide text-base-content/50">Due date</span>
              <input type="date" class="input input-sm w-full max-w-full rounded-md"
                [ngModel]="r.dueDate ?? ''" (ngModelChange)="patch($index, { dueDate: $event })"
                [name]="'due' + $index" />
            </label>

            <label class="min-w-0">
              <span class="mb-1 block text-3xs font-bold uppercase tracking-wide text-base-content/50">Add to list</span>
              <select class="select select-sm w-full max-w-full rounded-md truncate pr-8"
                [ngModel]="r.listId ?? ''" (ngModelChange)="patch($index, { listId: $event })"
                [name]="'list' + $index">
                @for (l of lists(); track l.id) {
                  <option [value]="l.id" [title]="l.name">
                    {{ formatShortName(l.name, 15) }}
                  </option>
                }
              </select>
            </label>

            <label class="min-w-0">
              <span class="mb-1 block text-3xs font-bold uppercase tracking-wide text-base-content/50">Priority</span>
              <select class="select select-sm w-full rounded-md truncate pr-8"
                [ngModel]="r.priority ?? 'medium'" (ngModelChange)="patch($index, { priority: $event })"
                [name]="'priority' + $index">
                @for (p of priorities; track p.id) {
                  <option [value]="p.id">{{ p.label }}</option>
                }
              </select>
            </label>
          </div>

          @if (r.description) {
            <p class="mt-2 rounded-md bg-base-200/60 px-2.5 py-1.5 text-2xs leading-relaxed text-base-content/70">
              {{ r.description }}
            </p>
          }
        </div>
      } @empty {
        <p class="py-8 text-center text-sm text-base-content/50">No cards to create.</p>
      }
    </div>

    <div class="flex shrink-0 items-center justify-between gap-2 border-t border-base-200 px-5 py-3">
      <span class="text-2xs text-base-content/55">
        Cards appear instantly for everyone viewing this board.
      </span>
      <span class="flex gap-2">
        <button type="button" class="btn btn-ghost btn-sm rounded-md" (click)="close.emit()">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm rounded-md gap-1.5"
          [disabled]="!canConfirm()" (click)="onConfirm()">
          @if (saving()) { <span class="loading loading-spinner loading-xs"></span> }
          Create {{ selectedCount() }} card(s)
        </button>
      </span>
    </div>
  </div>
</div>
