<!-- gap nhỏ vì `.chat` của daisyUI đã tự có `padding-block: .25rem` ở mỗi tin;
     giữ gap-2.5 như bản bong bóng cũ là cộng dồn thành khoảng hở quá thưa. -->
<div class="flex h-full flex-col gap-1 overflow-y-auto px-3 py-2.5" #scrollArea>
  @for (m of messages(); track trackByMessageId($index, m)) {
    <app-message-item [message]="m" [sender]="usersById()[m.userId] ?? null" [isOwn]="m.userId === currentUserId()" [memberNames]="memberNames()" />

    <!-- Chip gợi ý nằm NGAY DƯỚI tin nhắn sinh ra nó -->
    @if (suggestionsByMessageId()[m.id]; as goiY) {
      <!-- data-tour: neo bước "try-ai" của tour hướng dẫn. Đặt trên chip gợi ý
           chứ không trên cả khung chat — tour cần trỏ đúng vào thứ assistant
           vừa nghĩ ra, không phải vào cái ô chat chung chung. -->
      <app-task-suggestion-card
        data-tour="ai-suggestion"
        [suggestion]="goiY"
        [members]="members()"
        (open)="openSuggestion.emit(goiY)"
        (dismiss)="dismissSuggestion.emit(goiY)"
      />
    }
  }
</div>
