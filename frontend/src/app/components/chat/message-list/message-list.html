<!-- gap nhỏ vì `.chat` của daisyUI đã tự có `padding-block: .25rem` ở mỗi tin;
     giữ gap-2.5 như bản bong bóng cũ là cộng dồn thành khoảng hở quá thưa. -->
<div class="relative flex h-full min-h-0 flex-col">
<div class="flex h-full flex-col gap-1 overflow-y-auto px-3 py-2.5" #scrollArea (scroll)="onScroll()">
  <!-- Mốc canh cho IntersectionObserver. Phải nằm TRÊN mọi tin nhắn: chạm vào
       nó nghĩa là người dùng đã cuộn tới đầu danh sách và cần tin cũ hơn. -->
  @if (hasMore()) {
    <div #moc class="flex flex-shrink-0 justify-center py-2 text-3xs text-base-content/40">
      <span class="loading loading-dots loading-xs"></span>
    </div>
  }

  @for (m of messages(); track trackByMessageId($index, m)) {
    <app-message-item [attr.data-message-id]="m.id" [message]="m"
      [sender]="usersById()[m.userId] ?? null" [isOwn]="m.userId === currentUserId()"
      [currentUserId]="currentUserId()" [memberNames]="memberNames()"
      [highlighted]="dangSang() === m.id"
      (reply)="reply.emit($event)" (startEdit)="startEdit.emit($event)"
      (recall)="recall.emit($event)" (jumpTo)="nhayToi($event)" />

    <!-- Chip gợi ý nằm NGAY DƯỚI tin nhắn sinh ra nó -->
    @if (suggestionsByMessageId()[m.id]; as goiY) {
      <!-- Không còn `data-tour` ở đây.
           Bước "try-ai" từng neo vào chip này đã gộp vào bước chat, vì chip chỉ
           tồn tại khi backend có GEMINI_API_KEY — neo vào một thứ tuỳ chọn thì
           nửa số môi trường chạy tour không có gì để chỉ. Giữ lại một `data-tour`
           mà không bước nào tra tới chỉ khiến người đọc sau tưởng nó còn dùng. -->
      <app-task-suggestion-card
        [suggestion]="goiY"
        [members]="members()"
        (open)="openSuggestion.emit(goiY)"
        (dismiss)="dismissSuggestion.emit(goiY)"
      />
    }
  }
</div>

  @if (khongTimThay()) {
    <div class="pointer-events-none absolute inset-x-3 top-2 rounded-md bg-warning/90 px-3 py-1.5 text-center text-3xs font-semibold text-warning-content shadow">
      Tin nhắn gốc đã quá cũ, không tải tới nơi được.
    </div>
  }
</div>
