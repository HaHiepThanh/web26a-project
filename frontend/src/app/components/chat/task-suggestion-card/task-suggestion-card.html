<div class="max-w-[92%] self-start rounded-box border border-[var(--accent-purple)] bg-[var(--accent-purple-soft)] px-2.5 py-2">
  <div class="mb-1.5 flex items-center gap-1 text-3xs font-bold uppercase tracking-wide text-[var(--accent-purple)]">
    <svg class="h-[11px] w-[11px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
    AI detected a task
  </div>
  <div class="mb-0.5 text-xs font-semibold text-base-content">{{ suggestion().title }}</div>
  <div class="mb-1.5 text-3xs text-base-content/80">
    Assignee: {{ assigneeName() ?? 'Unknown' }}
    @if (suggestion().dueDate) {
      · Due: {{ suggestion().dueDate }}
    }
  </div>
  <div class="flex gap-1.5">
    <button type="button" class="btn btn-xs border-none bg-[var(--accent-purple)] text-white hover:brightness-110" (click)="confirm.emit()">Create card</button>
    <button type="button" class="btn btn-ghost btn-xs" (click)="dismiss.emit()">Dismiss</button>
  </div>
</div>
