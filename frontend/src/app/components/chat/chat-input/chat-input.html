<div class="relative">
  @if (mentionOpen() && mentionMatches().length) {
  <ul
    class="menu menu-xs absolute bottom-full left-2.5 right-2.5 mb-1 gap-0.5 overflow-hidden rounded-box border border-base-300 bg-base-100 p-1 shadow-md">
    @for (m of mentionMatches(); track m.id) {
    <li><button type="button" class="font-medium" (click)="pickMention(m, msgInput)">
        {{ m.displayName ?? m.email }}
      </button></li>
    }
  </ul>
  }

  <div class="flex items-center gap-2 bg-base-100 px-3 pb-3 pt-1.5">
    <textarea #msgInput rows="1"
      class="composer min-w-0 flex-1 rounded-[var(--radius-field)] border border-base-300 bg-base-100 text-base-content placeholder:text-base-content/45 transition-colors focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
      placeholder="@ to mention someone" title="Enter to send · Shift+Enter for a new line" [value]="value()"
      (input)="onInput($event)" (keydown)="onKeydown($event)"></textarea>
    <button type="button" class="btn btn-square btn-primary h-10 w-10 min-h-0 shrink-0"
      [disabled]="!value().trim()" (click)="onSend()" aria-label="Send">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" />
      </svg>
    </button>
  </div>
</div>
