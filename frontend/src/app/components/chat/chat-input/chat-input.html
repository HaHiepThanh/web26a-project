<div class="chat-input-wrap">
  @if (mentionOpen() && mentionMatches().length) {
    <div class="mention-dropdown">
      @for (m of mentionMatches(); track m.id) {
        <button type="button" class="mention-item" (click)="pickMention(m, msgInput)">
          {{ m.displayName ?? m.email }}
        </button>
      }
    </div>
  }

  <div class="chat-input-row">
    <input
      #msgInput
      type="text"
      placeholder="Nhắn gì đó cho cả nhóm... (gõ @ để nhắc tên)"
      [value]="value()"
      (input)="onInput($event)"
      (keydown.enter)="onSend()"
    />
    <button type="button" class="chat-send" (click)="onSend()" aria-label="Gửi">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>
