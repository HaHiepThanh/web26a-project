<div class="relative">
  @if (mentionOpen() && mentionMatches().length) {
    <div class="absolute bottom-full left-2.5 right-2.5 mb-1 overflow-hidden rounded-md border border-base-300 bg-base-100 shadow-md">
      @for (m of mentionMatches(); track m.id) {
        <button type="button" class="block w-full px-2.5 py-1.5 text-left text-xs font-medium text-base-content hover:bg-primary/10 hover:text-primary" (click)="pickMention(m, msgInput)">
          {{ m.displayName ?? m.email }}
        </button>
      }
    </div>
  }

  <div class="flex items-end gap-2 border-t border-base-300 bg-base-100 px-2.5 py-2">
    <textarea
      #msgInput
      rows="1"
      class="composer min-w-0 flex-1 rounded-xl border border-base-300 bg-base-100 text-base-content placeholder:text-base-content/45 transition-colors focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
      placeholder="Message the team... (@ to mention someone)"
      title="Enter to send · Shift+Enter for a new line"
      [value]="value()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button
      type="button"
      class="btn btn-square btn-primary btn-sm shrink-0"
      [disabled]="!value().trim()"
      (click)="onSend()"
      aria-label="Send">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>
