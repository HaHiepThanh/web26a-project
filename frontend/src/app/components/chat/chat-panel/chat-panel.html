<div
  class="chat-dock-shell relative flex h-full w-full flex-col overflow-hidden border-r-2 border-[var(--accent-purple)]/25 bg-base-100">
  @if (toastMessage(); as toast) {
  <div
    [class]="isMobile()
      ? 'msg-toast fixed bottom-20 right-4 z-50 flex w-[250px] cursor-pointer gap-2 rounded-md border border-base-300 bg-base-100 p-2.5 shadow-lg'
      : 'msg-toast absolute left-full top-3 z-20 ml-2 flex w-[250px] cursor-pointer gap-2 rounded-md border border-base-300 bg-base-100 p-2.5 shadow-lg'"
    (click)="openFromToast()">
    <span
      class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[var(--accent-purple)] text-2xs font-bold text-white">{{
      toast.name.charAt(0) }}</span>
    <div class="min-w-0">
      <div class="text-2xs font-bold text-base-content">{{ toast.name }}</div>
      <div class="mt-px truncate text-2xs text-base-content/80">{{ toast.text }}</div>
    </div>
  </div>
  }

  @if (collapsed()) {
  @if (isMobile()) {
  <button type="button"
    class="btn btn-secondary relative h-full w-full rounded-none border-none"
    [class.pulse]="pulse()" (click)="toggleCollapsed()" aria-label="Open chat panel">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
    </svg>
    @if (unreadCount() > 0) {
    <span
      class="badge badge-error absolute -right-1 -top-1 h-[18px] min-w-[18px] rounded-full border-2 border-base-100 px-1.5 text-3xs font-bold text-white">{{
      unreadCount() }}</span>
    }
  </button>
  } @else {
  <button type="button"
    class="btn btn-ghost relative h-full w-full flex-col gap-2.5 rounded-none border-none bg-secondary/15 py-3 text-secondary"
    [class.pulse]="pulse()" (click)="toggleCollapsed()" aria-label="Open chat panel">
    <span
      class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[var(--accent-purple)] text-white shadow-sm">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
      </svg>
    </span>
    @if (unreadCount() > 0) {
    <span
      class="badge badge-error h-[18px] min-w-[18px] rounded-full border-2 border-base-100 px-1.5 text-3xs font-bold text-white">{{
      unreadCount() }}</span>
    }
    <span class="rotate-180 whitespace-nowrap text-3xs font-bold [writing-mode:vertical-rl]">Chat</span>
  </button>
  }
  } @else {
  <div
    class="flex shrink-0 items-center justify-between border-b border-[var(--accent-purple)]/20 bg-[var(--accent-purple-soft)] px-3 py-2.5">
    <h3 class="flex min-w-0 items-center gap-1.5 truncate text-xs font-semibold text-base-content">
      <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-[var(--accent-purple)] text-white">
        <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
        </svg>
      </span>
      <span class="truncate">Team chat</span>
      @if (!realtimeConnected()) {
        <span class="badge badge-warning badge-sm shrink-0 gap-1 whitespace-nowrap font-semibold"
          title="Mất kết nối realtime — tin nhắn và gợi ý AI mới sẽ không tự hiện. Tải lại trang để nối lại.">
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" />
          </svg>
          Offline
        </span>
      }
    </h3>
    <div class="flex shrink-0 items-center gap-1">
      <button type="button" class="btn btn-square btn-ghost btn-xs relative rounded-[8px] before:absolute before:-inset-3 before:content-['']" (click)="toggleCollapsed()"
        [attr.aria-label]="isMobile() ? 'Close chat' : 'Collapse chat panel'" [attr.title]="isMobile() ? 'Close chat' : 'Collapse chat panel'">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
    </div>
  </div>

  <app-message-list [messages]="messages()" [usersById]="usersById()" [currentUserId]="currentUserId()"
    [memberNames]="memberNames()" [members]="members()"
    [suggestionsByMessageId]="suggestionsByMessageId()"
    (openSuggestion)="openSuggestion($event)"
    (dismissSuggestion)="dismissSuggestion($event)" />

  <app-chat-input [members]="members()" (send)="onSend($event)" />

  @if (!isMobile()) {
  <div
    class="resize-handle group absolute right-0 top-0 z-10 flex h-full w-2.5 cursor-col-resize touch-none items-center justify-center hover:bg-primary/15"
    [class.bg-primary]="resizing()" role="separator" aria-orientation="vertical" [attr.aria-valuenow]="width()"
    [attr.aria-valuemin]="minWidth" [attr.aria-valuemax]="maxWidth" aria-label="Drag to resize chat panel"
    tabindex="0" (pointerdown)="onResizeStart($event)" (keydown)="onResizeKeydown($event)">
    <span class="h-8 w-[3px] rounded-full bg-base-content/15 transition-colors group-hover:bg-primary"
      [class.bg-primary]="resizing()"></span>
  </div>
  }
  }
</div>
