<div class="flex items-center justify-between px-1.5 pb-1.5 pt-1">
  <span class="text-2xs font-black uppercase tracking-wider text-base-content/45">Notifications</span>
  @if (unreadCount() > 0) {
    <button type="button" class="btn btn-link btn-xs h-auto min-h-0 p-0 text-3xs font-bold"
      (click)="markAllRead.emit()">Mark all read</button>
  }
</div>

@if (dueCount() > 0) {
  <div class="mb-1 rounded border border-warning/40 bg-warning/10 px-2.5 py-2">
    <div class="text-2xs font-bold leading-snug text-base-content">
      {{ dueCount() }} of your cards are due soon or overdue
    </div>
  </div>
}

@if (notifications().length === 0) {
  <div class="px-1.5 py-4 text-center text-xs text-base-content/50">No notifications yet.</div>
} @else {
  <div class="flex max-h-[320px] flex-col gap-1 overflow-y-auto">
    @for (n of notifications(); track n.id) {
      <button type="button"
        class="btn btn-ghost h-auto min-h-0 justify-start rounded border px-2.5 py-2 text-left font-normal normal-case"
        [class.border-primary]="!n.read"
        [class.border-base-300]="n.read"
        (click)="openNotification.emit(n)">
        <div class="flex items-start gap-2">
          @if (!n.read) {
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-primary"></span>
          }
          <!-- Biểu tượng theo loại: chuông giờ chở BỐN loại tin khác hẳn nhau
               (được giao thẻ / quá hạn / có cuộc họp / bị @nhắc). Chỉ có chữ thì
               phải đọc hết mới biết cái nào đáng xử lý trước. -->
          <span class="mt-px grid h-4 w-4 shrink-0 place-items-center rounded"
            [class]="iconClass(n.type)">
            <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
              <path [attr.d]="iconPath(n.type)" />
            </svg>
          </span>
          <span class="min-w-0">
            <span class="block text-2xs font-semibold leading-snug text-base-content">{{ n.text }}</span>
            <span class="mt-0.5 block text-3xs text-base-content/45">{{ relativeTimeFrom(n.createdAt) }} · click to open board</span>
          </span>
        </div>
      </button>
    }
  </div>
}
