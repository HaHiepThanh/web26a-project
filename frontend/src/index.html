<!doctype html>
<html lang="vi" data-theme="winter">
  <head>
    <meta charset="utf-8" />
    <title>Horizon Hub Harmony — your team’s work, on one board</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A real-time Kanban board for small teams: drag and drop, labels, checklists, comments — plus an assistant that reads your chat and suggests the card, which only exists once you confirm it."
    />
    <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Tự động chuyển hướng link reset password của Firebase về trang /reset-password của website -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var mode = params.get('mode');
          var oobCode = params.get('oobCode');
          if (mode === 'resetPassword' && oobCode && !window.location.pathname.includes('/reset-password')) {
            window.location.replace('/reset-password' + window.location.search);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Icon trên tab trình duyệt. Dùng logo thương hiệu (HHH-logo.png) thay cho
       favicon.ico mặc định của Angular. Bản 32px cắt sẵn từ file gốc 1295px:
       trình duyệt vẽ icon ở 16-32px, đưa file gốc 907kB vào đây là bắt mọi lượt
       tải trang gánh gần 1MB chỉ để vẽ một ô vuông bé tí.
       apple-touch-icon dùng khi lưu trang ra màn hình chính trên iPhone/iPad —
       chỗ đó vẽ tới 180px nên cần bản riêng, không dùng chung bản 32px được. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- Thẻ xem trước khi dán link vào Zalo / Messenger / Discord / Slack.
       Không có mấy dòng này thì link chia sẻ chỉ hiện một dòng URL trần —
       với một trang giới thiệu, được chia sẻ chính là lý do nó tồn tại.

       CHƯA CÓ og:image. Cố ý bỏ trống thay vì trỏ vào một đường dẫn chưa có
       file: ảnh hỏng còn tệ hơn không ảnh, vì nền tảng sẽ hiện ô vỡ. Khi nào
       có ảnh 1200×630 thì thêm hai dòng này và đổi twitter:card sang
       "summary_large_image":
         <meta property="og:image" content="https://<tên-miền>/og-cover.png">
         <meta property="og:image:alt" content="Bảng Kanban của Horizon Hub Harmony"> -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon Hub Harmony" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Horizon Hub Harmony — your team’s work, on one board" />
    <meta
      property="og:description"
      content="A task board for small teams. Drag a card and it is saved — no Save button, no setup, nothing to install."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Horizon Hub Harmony — your team’s work, on one board" />
    <meta
      name="twitter:description"
      content="A task board for small teams. Drag a card and it is saved."
    />

    <!-- Be Vietnam Pro: bộ chữ riêng cho trang giới thiệu (landing), tự khoá
       font-family ngay trong landing.css nên không lẫn sang các trang khác.
       Nó cũng là bộ chữ dựng riêng cho dấu tiếng Việt: dấu đặt cân, không chồng
       lấn ở các tổ hợp dày như "ế", "ữ", "ợ" mà font phương Tây hay xử lý ẩu.
       Inter: `styles.css` đặt --font-family bắt đầu bằng 'Inter' cho toàn app,
       nhưng trước đây không có link nào thực sự nạp nó nên mọi trang (ngoài
       landing) âm thầm rơi về font hệ thống. Nạp thật ở đây để khớp với token.
       display=swap: chữ hiện ngay bằng font dự phòng, không để trang trắng chờ tải. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Hai bộ chữ chỉ dùng cho ĐÚNG MỘT khu vực: lá thư kể chuyện dự án.
       Lora (có chân) cho thân thư và Dancing Script cho chữ ký. Đổi mặt chữ ở
       đúng một chỗ là tín hiệu mạnh nhất để nói "phần này thuộc loại khác" —
       cả trang còn lại là sans.
       Đã kiểm: cả hai đều có đủ glyph tiếng Việt, kể cả tổ hợp dày như ằ, ữ, ợ, ế.
       Tệp font chỉ tải khi thật sự có chữ dùng tới, tức là chỉ ở trang landing;
       các trang khác chỉ chịu thêm một request CSS nhỏ. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&display=swap"
    />

    <!-- Đặt theme TRƯỚC khi trình duyệt vẽ khung hình đầu tiên.
       ThemeService cũng làm đúng việc này, nhưng nó chỉ chạy sau khi gói JS của
       Angular tải và khởi động xong — trong khoảng đó người chọn nền tối sẽ ăn
       trọn một nháy trắng loá mắt (FOUC). Đoạn script đồng bộ, không phụ thuộc
       gì, chạy ngay tại chỗ này nên nháy trắng biến mất.
       Logic phải khớp với readInitialTheme() trong services/theme.service.ts.

       Phần `landing` ở dưới: trang giới thiệu mượn theme tối `night` thay cho
       `sunset` của app (xem ThemeService.useThemes). Nếu chỗ này cứ ghi 'sunset'
       thì vào thẳng trang chủ ở chế độ tối sẽ thấy nháy một nhịp tông CAM của
       sunset rồi mới đổi sang tông xanh của night — đúng loại nháy mà cả đoạn
       script này sinh ra để dập. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('trello_theme');
          var dark =
            saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'night' : 'winter');
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* Trình duyệt chặn localStorage — cứ để nguyên data-theme="winter" mặc định. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
