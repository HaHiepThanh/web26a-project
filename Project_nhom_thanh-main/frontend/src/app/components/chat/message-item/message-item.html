<div [class]="isOwn() ? 'chat chat-end' : 'chat chat-start'">
  <div class="chat-image avatar avatar-placeholder">
    <div class="flex h-[26px] w-[26px] items-center justify-center rounded-full" [style.background]="avatarColor()">
      <span class="text-[10px] font-bold text-white">{{ initials() }}</span>
    </div>
  </div>
  <div class="chat-header text-xs font-semibold text-base-content/70">{{ senderLabel() }}</div>
  <div
    [class]="
      isOwn()
        ? 'chat-bubble rounded-2xl rounded-tr-md break-words bg-primary/10 text-sm leading-relaxed text-base-content'
        : 'chat-bubble rounded-2xl rounded-tl-md break-words bg-base-200 text-sm leading-relaxed text-base-content'
    "
  >
    @for (part of contentParts(); track $index) {
      @if (part.isMention) {
        <span class="font-semibold text-primary">{{ part.text }}</span>
      } @else {
        <span>{{ part.text }}</span>
      }
    }
  </div>
  <div class="chat-footer text-[10px] text-base-content/60">{{ timeLabel() }}</div>
</div>
