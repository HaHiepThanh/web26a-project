<div [class]="'h-full min-h-0 flex-col border-r border-base-300 bg-base-100 md:flex md:w-[300px] md:flex-shrink-0 ' + (hiddenOnMobile() ? 'hidden' : 'flex w-full')">
  <div class="flex flex-shrink-0 items-center justify-between border-b border-base-300 px-4 py-3.5">
    <h2 class="text-lg font-extrabold text-base-content">💬 Đoạn chat</h2>
    @if (totalUnread() > 0) {
      <span class="badge badge-error badge-sm text-white">{{ totalUnread() }}</span>
    }
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto" role="list" aria-label="Danh sách hội thoại theo board">
    <button
      type="button"
      role="listitem"
      [class]="'flex w-full items-center gap-2.5 border-b border-base-300/60 py-3 pr-3.5 pl-4 text-left hover:bg-base-200 ' + (selectedBoardId() === null ? 'bg-primary/10' : '')"
      (click)="selectOverview()"
    >
      <div class="avatar avatar-placeholder flex-shrink-0">
        <div class="w-10 rounded-full bg-primary text-primary-content text-base font-bold">📊</div>
      </div>
      <span class="truncate text-sm font-semibold text-base-content">Tổng quan</span>
    </button>

    @for (row of conversations(); track trackByBoardId($index, row)) {
      <button
        type="button"
        role="listitem"
        [class]="
          'flex w-full items-start gap-2.5 border-b border-base-300/60 py-3 pr-3.5 pl-4 text-left hover:bg-base-200 ' +
          (selectedBoardId() === row.board.id ? 'bg-primary/10' : row.unreadCount > 0 ? 'bg-primary/5' : '')
        "
        (click)="selectConversation(row.board)"
      >
        <div class="avatar avatar-placeholder flex-shrink-0">
          <div class="w-10 rounded-full text-sm font-bold text-white" [style.background]="row.avatarColor">{{ row.avatarInitials }}</div>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <span class="truncate text-sm" [class.font-bold]="row.unreadCount > 0" [class.font-semibold]="row.unreadCount === 0">{{ row.board.name }}</span>
            @if (row.lastMessageAt) {
              <span class="flex-shrink-0 text-xs text-base-content/50">{{ relativeTimeFrom(row.lastMessageAt) }}</span>
            }
          </div>
          <div class="mt-0.5 flex items-center justify-between gap-2">
            @if (row.lastSenderLabel && row.lastMessageText) {
              <span [class]="'truncate text-[13px] ' + (row.unreadCount > 0 ? 'font-semibold text-base-content' : 'text-base-content/60')">
                <span class="text-base-content/60">{{ row.lastSenderLabel }}:</span> {{ row.lastMessageText }}
              </span>
            } @else {
              <span class="truncate text-[13px] text-base-content/50">Chưa có tin nhắn</span>
            }
            @if (row.unreadCount > 0) {
              <span class="badge badge-primary badge-sm flex-shrink-0 text-white">{{ row.unreadCount }}</span>
            }
          </div>
        </div>
      </button>
    }

    @if (!conversations().length) {
      <div class="p-6 text-center text-sm text-base-content/50">Chưa có board nào.</div>
    }
  </div>
</div>
